<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet — NotesBazaar Nepal</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
  <div class="logo">📒 NotesBazaar<span>.np</span></div>
  <nav id="mainNav"></nav>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="wallet-pill" id="walletDisplay">👛 Rs. 0</span>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<main style="max-width:600px;">
  <h1 class="display" style="font-size:1.9rem;">👛 Wallet Topup</h1>
  <p style="color:var(--ink-soft);">Wallet mein paisa dalo, phir notes khareedne ke liye use karo. Payment karke screenshot upload karo — admin verify karke turant credit kar dega.</p>

  <div class="card" style="text-align:center; margin-bottom:20px;">
    <p style="font-weight:700; margin-bottom:10px;">Scan karke Payment Karo</p>
    <img id="qrImage" src="" alt="Payment QR" style="max-width:220px; border-radius:8px; border:2px solid var(--line);">
    <p style="font-size:0.85rem; color:var(--ink-soft); margin-top:10px;" id="paymentNote"></p>
  </div>

  <div class="card">
    <label>Kitna paisa dala? (Rs.)</label>
    <input type="number" id="amount" placeholder="e.g. 200" min="10">

    <label>Payment ka screenshot upload karo</label>
    <input type="file" id="proofFile" accept="image/*">

    <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="submitTopup()" id="topupBtn">Topup Request Bhejo</button>
  </div>

  <h3 class="display">📜 Topup History</h3>
  <div id="topupHistory"></div>
</main>

<footer>NotesBazaar Nepal</footer>
<div class="toast" id="toast"></div>

<script type="module">
import { requireAuth, renderNav, auth, signOut, db, doc, getDoc, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from "../js/app.js";
import { ADMIN_QR_URL, ADMIN_PAYMENT_NOTE, CLOUDINARY_CLOUD_NAME, CLOUDINARY_UPLOAD_PRESET } from "../js/firebase-config.js";

renderNav("wallet");
document.getElementById("logoutBtn").onclick = () => signOut(auth).then(()=>window.location.href="../index.html");
document.getElementById("qrImage").src = ADMIN_QR_URL;
document.getElementById("paymentNote").textContent = ADMIN_PAYMENT_NOTE;

function showToast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

let currentUser = null;

requireAuth(async (user) => {
  currentUser = user;
  const uSnap = await getDoc(doc(db, "users", user.uid));
  const data = uSnap.data();
  document.getElementById("walletDisplay").textContent = "👛 Rs. " + (data.walletBalance || 0);
  await loadHistory(user.uid);
});

window.submitTopup = async () => {
  const amount = parseInt(document.getElementById("amount").value);
  const file = document.getElementById("proofFile").files[0];
  if(!amount || amount < 10){ showToast("Sahi amount daalo (min Rs. 10)"); return; }
  if(!file){ showToast("Payment ka screenshot upload karo"); return; }

  const btn = document.getElementById("topupBtn");
  btn.disabled = true; btn.textContent = "Uploading...";

  try{
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: "POST", body: formData });
    const uploadData = await uploadRes.json();
    if(!uploadData.secure_url) throw new Error(uploadData.error?.message || "Upload fail hua");

    await addDoc(collection(db, "topups"), {
      uid: currentUser.uid,
      name: currentUser.displayName || "Student",
      email: currentUser.email,
      amount,
      proofURL: uploadData.secure_url,
      status: "pending",
      createdAt: serverTimestamp()
    });

    showToast("Topup request bhej diya! Admin verify karne ke baad wallet mein add ho jayega 🎉");
    document.getElementById("amount").value = "";
    document.getElementById("proofFile").value = "";
    await loadHistory(currentUser.uid);
  }catch(e){
    showToast("Error: " + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "Topup Request Bhejo";
  }
};

async function loadHistory(uid){
  const q = query(collection(db, "topups"), where("uid", "==", uid), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);
  const box = document.getElementById("topupHistory");
  if(snap.empty){ box.innerHTML = `<p style="color:var(--ink-soft);">Abhi tak koi topup nahi kiya.</p>`; return; }
  box.innerHTML = "";
  snap.forEach(d => {
    const t = d.data();
    const statusColor = t.status === "approved" ? "var(--green)" : t.status === "rejected" ? "var(--accent)" : "#B8860B";
    const statusText = t.status === "approved" ? "✓ Approved" : t.status === "rejected" ? "✗ Rejected" : "⏳ Pending";
    const row = document.createElement("div");
    row.className = "card";
    row.style.marginBottom = "8px";
    row.innerHTML = `Rs. ${t.amount} <span style="float:right; font-weight:700; color:${statusColor};">${statusText}</span>`;
    box.appendChild(row);
  });
}
</script>
</body>
</html>
